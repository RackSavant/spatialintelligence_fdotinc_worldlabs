<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Marble Hack</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
      canvas { display: block; }
      #hud {
        position: fixed; left: 12px; bottom: 12px;
        font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
        color: #fff; opacity: .65; pointer-events: none; text-shadow: 0 1px 2px #000;
      }
      #loading {
        position: fixed; inset: 0; display: grid; place-items: center;
        font: 14px ui-monospace, Menlo, monospace; color: #fff; background: #000;
        transition: opacity .4s; 
      }
      #loading.done { opacity: 0; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="loading">loading splat…</div>
    <div id="hud">WASD / arrows to move · drag to look · scroll to zoom</div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
